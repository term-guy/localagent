[package]
name = "localagent"
version = "0.1.0"
description = "localagent - offline AI agent desktop app"
authors = []
edition = "2021"

[lib]
name = "localagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "localagent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
open = "5"
zip = "2"

cactus-sys = { path = "/Users/luis/gitterm/cactus/rust/cactus-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = "0.1"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
